{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — StockMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body class="login-body d-flex align-items-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <a href="{% url 'landing' %}" class="text-decoration-none">
                    <h3 class="fw-bold text-white"><i class="bi bi-boxes"></i> StockMS</h3>
                </a>
            </div>
            <a href="javascript:history.back()" class="btn btn-sm btn-outline-light mb-3">
                <i class="bi bi-arrow-left"></i> Back
            </a>
            <div class="card login-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <h4 class="fw-bold mb-1">Welcome back</h4>
                    <p class="text-muted mb-4">Sign in to access your dashboard.</p>

                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            <i class="bi bi-exclamation-circle"></i> Incorrect username or password. Please try again.
                        </div>
                    {% endif %}

                    <form method="post" id="loginForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                                <input type="text" name="username" class="form-control" required autofocus>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" id="passwordInput" class="form-control" required>
                                <span class="input-group-text bg-white" role="button" onclick="togglePassword()">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </span>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small text-decoration-none">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
                            <span id="btnText">Login</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                        </button>
                    </form>

                    <p class="text-center text-muted small mt-4 mb-0">
                        Don't have an account? Contact your administrator to get one set up.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('toggleIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}

document.getElementById('loginForm').addEventListener('submit', function() {
    document.getElementById('btnText').textContent = 'Signing in...';
    document.getElementById('btnSpinner').classList.remove('d-none');
    document.getElementById('loginBtn').disabled = true;
});
</script>
</body>
</html>
