{% extends 'base.html' %}
{% block title %}New Purchase Order{% endblock %}
{% block content %}

<h2 class="mb-4">New Purchase Order</h2>

<form method="post">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">Supplier</label>
        <select name="supplier" class="form-select" required>
            <option value="">-- Select Supplier --</option>
            {% for s in suppliers %}
                <option value="{{ s.id }}">{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Notes (optional)</label>
        <input type="text" name="notes" class="form-control">
    </div>

    <hr>
    <h5>Items to Order</h5>
    <div id="item-rows">
        <div class="row mb-2 item-row">
            <div class="col-md-5">
                <select name="product" class="form-select" required>
                    <option value="">-- Select Product --</option>
                    {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Current stock: {{ p.quantity }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <input type="number" name="quantity" class="form-control" placeholder="Quantity" min="1" required>
            </div>
            <div class="col-md-3">
                <input type="number" step="0.01" name="unit_cost" class="form-control" placeholder="Unit Cost (₹)" required>
            </div>
        </div>
    </div>
    <button type="button" class="btn btn-sm btn-outline-secondary mb-3" onclick="addRow()">+ Add another item</button>

    <div>
        <button type="submit" class="btn btn-primary">Create Purchase Order</button>
    </div>
</form>

<script>
function addRow() {
    const container = document.getElementById('item-rows');
    const newRow = container.children[0].cloneNode(true);
    newRow.querySelectorAll('input').forEach(i => i.value = '');
    newRow.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
    container.appendChild(newRow);
}
</script>

{% endblock %}
