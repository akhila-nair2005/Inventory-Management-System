{% extends 'base.html' %}
{% block title %}Add Supplier{% endblock %}
{% block content %}

<h2 class="mb-4">Add Supplier</h2>

<form method="post" class="col-md-6">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label">Name</label><input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Contact Person</label><input type="text" name="contact_person" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Phone</label><input type="text" name="phone" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control"></div>
    <div class="mb-3"><label class="form-label">Address</label><textarea name="address" class="form-control"></textarea></div>
    <div class="mb-3"><label class="form-label">GST Number</label><input type="text" name="gst_number" class="form-control"></div>
    <button type="submit" class="btn btn-primary">Save Supplier</button>
</form>

{% endblock %}
